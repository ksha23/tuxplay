# The sink this project adds: one output in the desktop's sound panel, feeding
# owntone, which sends to whichever AirPlay 2 receivers are selected - a stereo
# pair, several speakers at once, or one.
#
# It is deliberately not named after any particular speaker. What it feeds is
# chosen from the top bar menu, the control panel or `tuxplay`, not here.
#
# The other AirPlay entries in the sound panel are NOT from this project. They
# are PipeWire's own raop sinks, created by module-raop-discover, and they speak
# AirPlay 1: the module contains no SETPEERS, no SETRATEANCHORTIME and no
# bufferStream, only the classic ANNOUNCE/RECORD flow. They address one speaker
# each and cannot drive a stereo pair, which is why this project exists.
#
# session.suspend-timeout-seconds = 0 keeps this sink running even with no
# client, so pipe-tunnel writes continuously (silence when idle). OwnTone's
# pipe input starts playback from a watch that fires when data appears; if the
# pipe ever goes idle the watch has to be re-armed, which is why playback
# needed two pause/resume cycles to come back. A never-idle pipe avoids it.
context.modules = [
  { name = libpipewire-module-pipe-tunnel
    args = {
      tunnel.mode         = sink
      tunnel.latency.msec = 315
      pipe.filename       = "/var/lib/owntone-mini/pipewire"
      node.name           = "tuxplay"
      node.description    = "Tuxplay (AirPlay 2)"
      audio.format        = "S16LE"
      audio.rate          = 44100
      audio.channels      = 2
      audio.position      = [ FL FR ]
      stream.props        = {
        media.class = "Audio/Sink"
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
        # suspend-timeout only stops WirePlumber from suspending an idle node;
        # it never activates a node nothing is linked to, so the sink sat in
        # SUSPENDED and no bytes reached the FIFO. always-process keeps the
        # node running with no client, so the tunnel writes silence and
        # OwnTone's pipe input - and the AirPlay sessions behind it - stay hot.
        node.always-process = true
      }
    }
  }
]
