# Managed by airplayctl. Discovers AirPlay (RAOP) receivers as sinks.
context.modules = [
  { name = libpipewire-module-raop-discover
    args = {
      stream.rules = [
        { matches = [ { raop.ip = "~.*" } ]
          actions = { create-stream = {
            # Sender-side scheduling depth, in milliseconds.
            # Lower = more responsive, less buffer for Wi-Fi jitter.
            sess.latency.msec = 250
          } } }
      ]
    }
  }
]
